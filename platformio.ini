; Configuration PlatformIO minimale, uniquement pour exécuter les tests sur PC.
; Le firmware reste compilé / téléversé depuis l'IDE Arduino.
[env:native]
platform = native
test_framework = googletest
build_flags =
    -std=gnu++17
    -DARDUINO=100  ; la bibliothèque PID inclut Arduino.h seulement si ARDUINO >= 100
    -I$PROJECT_DIR
    -I$PROJECT_DIR/test/support
lib_compat_mode = off  ; PID est déclarée « arduino » : on la force à compiler en natif
lib_deps =
    br3ttb/PID@^1.2.1
